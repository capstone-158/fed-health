version: "3.9"

services:
  redis_h0:
    image: redis:alpine
    networks:
      - mednet

  redis_h1:
    image: redis:alpine
    networks:
      - mednet

  redis_h2:
    image: redis:alpine
    networks:
      - mednet

  bc_node_0:
    build: ./bc_node
    networks:
      - mednet
    volumes:
      - ./bc_node:/app
      - ./shared:/app/shared:ro
      - ./bc_node/ledger:/app/ledger
    environment:
      BC_NODE_ID: 0
      LEADER: True
      BC_NODE_NAME: bc_node_0
      BC_NODE_PORT: 5000
    ports:
      - "5000:5000"

  bc_node_1:
    build: ./bc_node
    networks:
      - mednet
    volumes:
      - ./bc_node:/app
      - ./shared:/app/shared:ro
      - ./bc_node/ledger:/app/ledger
    environment:
      BC_NODE_ID: 1
      LEADER: False
      BC_NODE_NAME: bc_node_1
      BC_NODE_PORT: 5000
    ports:
      - "5100:5000"

  bc_node_2:
    build: ./bc_node
    networks:
      - mednet
    volumes:
      - ./bc_node:/app
      - ./shared:/app/shared:ro
      - ./bc_node/ledger:/app/ledger
    environment:
      BC_NODE_ID: 2
      LEADER: False
      BC_NODE_NAME: bc_node_2
      BC_NODE_PORT: 5000
    ports:
      - "5200:5000"

  h_node_0:
    build: ./h_node
    networks:
      - mednet
    volumes:
      - ./h_node:/app
      - ./shared:/app/shared:ro
      - ./h_node/secrets:/app/secrets
      - ./h_node/cached:/app/cached
    depends_on:
      - redis_h0
    environment:
      H_ID: 0
      model_type: alexnet
      H_NODE_NAME: hospital_0
      REDIS_HOST: redis_h0
      nodes: "node_0,node_1"
    ports:
      - "8000:8000"

  h_node_1:
    build: ./h_node
    networks:
      - mednet
    volumes:
      - ./h_node:/app
      - ./shared:/app/shared:ro
      - ./h_node/secrets:/app/secrets
      - ./h_node/cached:/app/cached
    environment:
      H_ID: 1
      model_type: resnet
      H_NODE_NAME: hospital_1
      REDIS_HOST: redis_h1
      nodes: "node_2,node_3"
    depends_on:
      - redis_h1
    ports:
      - "8100:8000"

  h_node_2:
    build: ./h_node
    networks:
      - mednet
    volumes:
      - ./h_node:/app
      - ./shared:/app/shared:ro
      - ./h_node/secrets:/app/secrets
      - ./h_node/cached:/app/cached
    environment:
      H_ID: 2
      model_type: net
      H_NODE_NAME: hospital_2
      REDIS_HOST: redis_h2
      nodes: "node_4,node_5"
    depends_on:
      - redis_h2
    ports:
      - "8200:8000"

  node_0:
    build: ./node
    volumes:
      - ./node:/app
      - ./shared:/app/shared:ro
      - ./other/models:/app/models:ro   # this can be removed once everything is working
      - ./data/node_0.pt:/app/data.pt
    environment:
      NODE_ID: 0
      H_ID: 0
      H_HOST: h_node_0
      REDIS_HOST: redis_h0
    networks:
      - mednet
    
  node_1:
    build: ./node
    volumes:
      - ./node:/app
      - ./shared:/app/shared:ro
      - ./other/models:/app/models:ro
      - ./data/node_1.pt:/app/data.pt
    environment:
      NODE_ID: 1
      H_ID: 0
      H_HOST: h_node_0
      REDIS_HOST: redis_h0
    networks:
      - mednet

  node_2:
    build: ./node
    volumes:
      - ./node:/app
      - ./shared:/app/shared:ro
      - ./other/models:/app/models:ro
      - ./data/node_2.pt:/app/data.pt
    environment:
      NODE_ID: 2
      H_ID: 1
      H_HOST: h_node_1
      REDIS_HOST: redis_h1
    networks:
      - mednet

  node_3:
    build: ./node
    volumes:
      - ./node:/app
      - ./shared:/app/shared:ro
      - ./other/models:/app/models:ro
      - ./data/node_3.pt:/app/data.pt
    environment:
      NODE_ID: 3
      H_ID: 1
      H_HOST: h_node_1
      REDIS_HOST: redis_h1
    networks:
      - mednet

  node_4:
    build: ./node
    volumes:
      - ./node:/app
      - ./shared:/app/shared:ro
      - ./other/models:/app/models:ro
      - ./data/node_4.pt:/app/data.pt
    environment:
      NODE_ID: 4
      H_ID: 2
      H_HOST: h_node_2
      REDIS_HOST: redis_h2
    networks:
      - mednet

  node_5:
    build: ./node
    volumes:
      - ./node:/app
      - ./shared:/app/shared:ro
      - ./other/models:/app/models:ro
      - ./data/node_5.pt:/app/data.pt
    environment:
      NODE_ID: 5
      H_ID: 2
      H_HOST: h_node_2
      REDIS_HOST: redis_h2
    networks:
      - mednet

networks:
  mednet:
    driver: bridge