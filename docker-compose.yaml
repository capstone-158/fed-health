version: "3.9"

services:
  redis_h0:
    image: redis:alpine
    networks:
      - mednet
    ports:
      - "6380:6379"   # reachable from macOS for natively running nodes (run_native.py)

  redis_h1:
    image: redis:alpine
    networks:
      - mednet
    ports:
      - "6381:6379"   # reachable from macOS for natively running nodes (run_native.py)

  redis_h2:
    image: redis:alpine
    networks:
      - mednet
    ports:
      - "6382:6379"   # reachable from macOS for natively running nodes (run_native.py)

  bc_node_0:
    build: ./bc_node
    networks:
      - mednet
    volumes:
      - ./bc_node:/app
      - ./shared:/app/shared:ro
      - ./node_ledgers/bc_node_ledger_0:/app/ledger
    environment:
      BC_NODE_ID: 0
      LEADER: True
      BC_NODE_NAME: bc_node_0
      BC_NODE_PORT: 5000
    ports:
      - "5050:5000"   # 5000 on macOS is taken by AirPlay (ControlCenter)

  bc_node_1:
    build: ./bc_node
    networks:
      - mednet
    volumes:
      - ./bc_node:/app
      - ./shared:/app/shared:ro
      - ./node_ledgers/bc_node_ledger_1:/app/ledger
    environment:
      BC_NODE_ID: 1
      LEADER: False
      BC_NODE_NAME: bc_node_1
      BC_NODE_PORT: 5000
    ports:
      - "5100:5000"

  bc_node_2:
    build: ./bc_node
    networks:
      - mednet
    volumes:
      - ./bc_node:/app
      - ./shared:/app/shared:ro
      - ./node_ledgers/bc_node_ledger_2:/app/ledger
    environment:
      BC_NODE_ID: 2
      LEADER: False
      BC_NODE_NAME: bc_node_2
      BC_NODE_PORT: 5000
    ports:
      - "5200:5000"

  h_node_0:
    build: ./h_node
    networks:
      - mednet
    volumes:
      - ./h_node:/app
      - ./shared:/app/shared:ro
      - ./h_node/secrets:/app/secrets
      - ./h_node/cached:/app/cached
      - ${DATA_DIR:-./data/tiny}:/app/data:ro
    depends_on:
      - redis_h0
    environment:
      H_ID: 0
      model_type: ${H0_MODEL:-test}
      ROUNDS: ${ROUNDS:-10}
      EPOCHS: ${EPOCHS:-20}
      BATCH_SIZE: ${BATCH_SIZE:-128}
      MICRO_BATCH: ${MICRO_BATCH:-128}
      ROUND_TIMEOUT: ${ROUND_TIMEOUT:-600}
      NUM_CLASSES: ${NUM_CLASSES:-9}
      TWIN_TRUST: ${TWIN_TRUST:-off}
      ATTACK: ${ATTACK:-none}
      ATTACK_NODE: ${ATTACK_NODE:-}
      H_NODE_NAME: hospital_0
      REDIS_HOST: redis_h0
      nodes: "node_0,node_1"
    ports:
      - "8000:8000"
      - "4000:4000"   # heartbeat port, for natively running nodes

  h_node_1:
    build: ./h_node
    networks:
      - mednet
    volumes:
      - ./h_node:/app
      - ./shared:/app/shared:ro
      - ./h_node/secrets:/app/secrets
      - ./h_node/cached:/app/cached
      - ${DATA_DIR:-./data/tiny}:/app/data:ro
    environment:
      H_ID: 1
      model_type: ${H1_MODEL:-test}
      ROUNDS: ${ROUNDS:-10}
      EPOCHS: ${EPOCHS:-20}
      BATCH_SIZE: ${BATCH_SIZE:-128}
      MICRO_BATCH: ${MICRO_BATCH:-128}
      ROUND_TIMEOUT: ${ROUND_TIMEOUT:-600}
      NUM_CLASSES: ${NUM_CLASSES:-9}
      TWIN_TRUST: ${TWIN_TRUST:-off}
      ATTACK: ${ATTACK:-none}
      ATTACK_NODE: ${ATTACK_NODE:-}
      H_NODE_NAME: hospital_1
      REDIS_HOST: redis_h1
      nodes: "node_2,node_3"
    depends_on:
      - redis_h1
    ports:
      - "8100:8000"
      - "4100:4000"   # heartbeat port, for natively running nodes

  h_node_2:
    build: ./h_node
    networks:
      - mednet
    volumes:
      - ./h_node:/app
      - ./shared:/app/shared:ro
      - ./h_node/secrets:/app/secrets
      - ./h_node/cached:/app/cached
      - ${DATA_DIR:-./data/tiny}:/app/data:ro
    environment:
      H_ID: 2
      model_type: ${H2_MODEL:-test}
      ROUNDS: ${ROUNDS:-10}
      EPOCHS: ${EPOCHS:-20}
      BATCH_SIZE: ${BATCH_SIZE:-128}
      MICRO_BATCH: ${MICRO_BATCH:-128}
      ROUND_TIMEOUT: ${ROUND_TIMEOUT:-600}
      NUM_CLASSES: ${NUM_CLASSES:-9}
      TWIN_TRUST: ${TWIN_TRUST:-off}
      ATTACK: ${ATTACK:-none}
      ATTACK_NODE: ${ATTACK_NODE:-}
      H_NODE_NAME: hospital_2
      REDIS_HOST: redis_h2
      nodes: "node_4,node_5"
    depends_on:
      - redis_h2
    ports:
      - "8200:8000"
      - "4200:4000"   # heartbeat port, for natively running nodes

  node_0:
    build: ./node
    volumes:
      - ./node:/app
      - ./shared:/app/shared:ro
      # - ./other/models:/app/models:ro   # this can be removed once everything is working
      - ${DATA_DIR:-./data/tiny}:/app/data:ro
    environment:
      NODE_ID: 0
      H_ID: 0
      H_HOST: h_node_0
      ROUNDS: ${ROUNDS:-10}
      EPOCHS: ${EPOCHS:-20}
      BATCH_SIZE: ${BATCH_SIZE:-128}
      MICRO_BATCH: ${MICRO_BATCH:-128}
      ROUND_TIMEOUT: ${ROUND_TIMEOUT:-600}
      NUM_CLASSES: ${NUM_CLASSES:-9}
      TWIN_TRUST: ${TWIN_TRUST:-off}
      ATTACK: ${ATTACK:-none}
      ATTACK_NODE: ${ATTACK_NODE:-}
      REDIS_HOST: redis_h0
    networks:
      - mednet
    
  node_1:
    build: ./node
    volumes:
      - ./node:/app
      - ./shared:/app/shared:ro
      # - ./other/models:/app/models:ro
      - ${DATA_DIR:-./data/tiny}:/app/data:ro
    environment:
      NODE_ID: 1
      H_ID: 0
      H_HOST: h_node_0
      ROUNDS: ${ROUNDS:-10}
      EPOCHS: ${EPOCHS:-20}
      BATCH_SIZE: ${BATCH_SIZE:-128}
      MICRO_BATCH: ${MICRO_BATCH:-128}
      ROUND_TIMEOUT: ${ROUND_TIMEOUT:-600}
      NUM_CLASSES: ${NUM_CLASSES:-9}
      TWIN_TRUST: ${TWIN_TRUST:-off}
      ATTACK: ${ATTACK:-none}
      ATTACK_NODE: ${ATTACK_NODE:-}
      REDIS_HOST: redis_h0
    networks:
      - mednet

  node_2:
    build: ./node
    volumes:
      - ./node:/app
      - ./shared:/app/shared:ro
      # - ./other/models:/app/models:ro
      - ${DATA_DIR:-./data/tiny}:/app/data:ro
    environment:
      NODE_ID: 2
      H_ID: 1
      H_HOST: h_node_1
      ROUNDS: ${ROUNDS:-10}
      EPOCHS: ${EPOCHS:-20}
      BATCH_SIZE: ${BATCH_SIZE:-128}
      MICRO_BATCH: ${MICRO_BATCH:-128}
      ROUND_TIMEOUT: ${ROUND_TIMEOUT:-600}
      NUM_CLASSES: ${NUM_CLASSES:-9}
      TWIN_TRUST: ${TWIN_TRUST:-off}
      ATTACK: ${ATTACK:-none}
      ATTACK_NODE: ${ATTACK_NODE:-}
      REDIS_HOST: redis_h1
    networks:
      - mednet

  node_3:
    build: ./node
    volumes:
      - ./node:/app
      - ./shared:/app/shared:ro
      # - ./other/models:/app/models:ro
      - ${DATA_DIR:-./data/tiny}:/app/data:ro
    environment:
      NODE_ID: 3
      H_ID: 1
      H_HOST: h_node_1
      ROUNDS: ${ROUNDS:-10}
      EPOCHS: ${EPOCHS:-20}
      BATCH_SIZE: ${BATCH_SIZE:-128}
      MICRO_BATCH: ${MICRO_BATCH:-128}
      ROUND_TIMEOUT: ${ROUND_TIMEOUT:-600}
      NUM_CLASSES: ${NUM_CLASSES:-9}
      TWIN_TRUST: ${TWIN_TRUST:-off}
      ATTACK: ${ATTACK:-none}
      ATTACK_NODE: ${ATTACK_NODE:-}
      REDIS_HOST: redis_h1
    networks:
      - mednet

  node_4:
    build: ./node
    volumes:
      - ./node:/app
      - ./shared:/app/shared:ro
      # - ./other/models:/app/models:ro
      - ${DATA_DIR:-./data/tiny}:/app/data:ro
    environment:
      NODE_ID: 4
      H_ID: 2
      H_HOST: h_node_2
      ROUNDS: ${ROUNDS:-10}
      EPOCHS: ${EPOCHS:-20}
      BATCH_SIZE: ${BATCH_SIZE:-128}
      MICRO_BATCH: ${MICRO_BATCH:-128}
      ROUND_TIMEOUT: ${ROUND_TIMEOUT:-600}
      NUM_CLASSES: ${NUM_CLASSES:-9}
      TWIN_TRUST: ${TWIN_TRUST:-off}
      ATTACK: ${ATTACK:-none}
      ATTACK_NODE: ${ATTACK_NODE:-}
      REDIS_HOST: redis_h2
    networks:
      - mednet

  node_5:
    build: ./node
    volumes:
      - ./node:/app
      - ./shared:/app/shared:ro
      # - ./other/models:/app/models:ro
      - ${DATA_DIR:-./data/tiny}:/app/data:ro
    environment:
      NODE_ID: 5
      H_ID: 2
      H_HOST: h_node_2
      ROUNDS: ${ROUNDS:-10}
      EPOCHS: ${EPOCHS:-20}
      BATCH_SIZE: ${BATCH_SIZE:-128}
      MICRO_BATCH: ${MICRO_BATCH:-128}
      ROUND_TIMEOUT: ${ROUND_TIMEOUT:-600}
      NUM_CLASSES: ${NUM_CLASSES:-9}
      TWIN_TRUST: ${TWIN_TRUST:-off}
      ATTACK: ${ATTACK:-none}
      ATTACK_NODE: ${ATTACK_NODE:-}
      REDIS_HOST: redis_h2
    networks:
      - mednet

networks:
  mednet:
    driver: bridge