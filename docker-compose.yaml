version: "3.9"

services:
  h_node_0:
    build:
      context: ./h_node/
      dockerfile: Dockerfile
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
    environment:
      H_ID: 0
    ports:
      - "8000:8000"

  h_node_1:
    build:
      context: ./h_node/
      dockerfile: Dockerfile
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
    environment:
      H_ID: 1
    ports:
      - "8200:8200"

  node:
    build:
      context: ./node
      dockerfile: Dockerfile
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
    environment:
      - NODE_ID=1
      - H_NODE_URL=http://h_node:8000
      - BC_NODE_URL=http://bc_node:5000
    deploy:
      replicas: 4
  
networks:
  mednet:
    driver: bridge
