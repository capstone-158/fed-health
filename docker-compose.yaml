version: "3.9"

services:
  redis_h0:
    image: redis:alpine
    networks:
      - mednet

  redis_h1:
    image: redis:alpine
    networks:
      - mednet

  redis_h2:
    image: redis:alpine
    networks:
      - mednet

  bc_node_0:
    build: ./bc_node
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
      - ./bc_node:/app
    environment:
      BC_NODE_ID: 0
      LEADER: True
      BC_NODE_NAME: bc_node_0
      BC_NODE_PORT: 5000
    ports:
      - "5000:5000"

  bc_node_1:
    build: ./bc_node
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
      - ./bc_node:/app
    environment:
      BC_NODE_ID: 1
      LEADER: False
      BC_NODE_NAME: bc_node_1
      BC_NODE_PORT: 5000
    ports:
      - "5100:5000"

  bc_node_2:
    build: ./bc_node
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
      - ./bc_node:/app
    environment:
      BC_NODE_ID: 2
      LEADER: False
      BC_NODE_NAME: bc_node_2
      BC_NODE_PORT: 5000
    ports:
      - "5200:5000"

  h_node_0:
    build: ./h_node
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
      - ./h_node:/app
    depends_on:
      - redis_h0
    environment:
      H_ID: 0
      H_NODE_NAME: hospital_0
      REDIS_HOST: redis_h0
    ports:
      - "8000:8000"

  h_node_1:
    build: ./h_node
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
      - ./h_node:/app
    environment:
      H_ID: 1
      H_NODE_NAME: hospital_1
      REDIS_HOST: redis_h1
    depends_on:
      - redis_h1
    ports:
      - "8100:8000"

  h_node_2:
    build: ./h_node
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
      - ./h_node:/app
    environment:
      H_ID: 2
      H_NODE_NAME: hospital_2
      REDIS_HOST: redis_h2
    depends_on:
      - redis_h2
    ports:
      - "8200:8000"

  node_0:
    build: ./node
    volumes:
      - ./data/node_0:/app/data
      - ./shared:/app/shared
      - ./other/models/:/app/models
      - ./node:/app
    environment:
      NODE_ID: 0
      H_ID: 0
      H_HOST: h_node_0
    networks:
      - mednet
    
  node_1:
    build: ./node
    volumes:
      - ./data/node_1:/app/data
      - ./shared:/app/shared
      - ./node:/app
      - ./other/models/:/app/models
    environment:
      NODE_ID: 1
      H_ID: 0
      H_HOST: h_node_0
    networks:
      - mednet

  node_2:
    build: ./node
    volumes:
      - ./data/node_2:/app/data
      - ./shared:/app/shared
      - ./node:/app
      - ./other/models/:/app/models
    environment:
      NODE_ID: 2
      H_ID: 1
      H_HOST: h_node_1
    networks:
      - mednet

  node_3:
    build: ./node
    volumes:
      - ./data/node_3:/app/data
      - ./shared:/app/shared
      - ./other/models/:/app/models
      - ./node:/app
    environment:
      NODE_ID: 3
      H_ID: 1
      H_HOST: h_node_1
    networks:
      - mednet

  node_4:
    build: ./node
    volumes:
      - ./data/node_4:/app/data
      - ./shared:/app/shared
      - ./other/models/:/app/models
      - ./node:/app
    environment:
      NODE_ID: 4
      H_ID: 2
      H_HOST: h_node_2
    networks:
      - mednet

  node_5:
    build: ./node
    volumes:
      - ./data/node_5:/app/data
      - ./shared:/app/shared
      - ./node:/app
      - ./other/models/:/app/models
    environment:
      NODE_ID: 5
      H_ID: 2
      H_HOST: h_node_2
    networks:
      - mednet

networks:
  mednet:
    driver: bridge
