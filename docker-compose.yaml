version: "3.9"

services:
  reg_server_0:
    build:
      context: ./reg_server/
      dockerfile: Dockerfile
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
    environment:
      REGION_ID: 0
    ports:
      - "8000:8000"

  reg_server_1:
    build:
      context: ./reg_server/
      dockerfile: Dockerfile
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
    environment:
      REGION_ID: 1
    ports:
      - "8100:8100"

  reg_server_2:
    build:
      context: ./reg_server/
      dockerfile: Dockerfile
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
    environment:
      REGION_ID: 2
    ports:
      - "8200:8200"

  node:
    build:
      context: ./node
      dockerfile: Dockerfile
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
    environment:
      REG_SERVER: reg_server_0,reg_server_1,reg_server_2
      NUM_REG_SERVERS: "3"
  
networks:
  mednet:
    driver: bridge
