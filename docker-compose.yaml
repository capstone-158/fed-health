version: "3.9"

services:
  reg_server_0:
    build:
      context: ./reg_server/
      dockerfile: Dockerfile
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
    environment:
      REGION_ID: 0

  reg_server_1:
    build:
      context: ./reg_server/
      dockerfile: Dockerfile
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
    environment:
      REGION_ID: 1

  reg_server_2:
    build:
      context: ./reg_server/
      dockerfile: Dockerfile
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
    environment:
      REGION_ID: 2

  node:
    build:
      context: ./node
      dockerfile: Dockerfile
    networks:
      - mednet
    volumes:
      - ./shared:/app/shared
    environment:
      REG_SERVER: reg_server_0,reg_server_1,reg_server_2
      NUM_REG_SERVERS: "3"


networks:
  mednet:
    driver: bridge
